name: Wework 4567 Package Verification

on:
  push:
    branches:
      - fix/wework-installed-source-snapshot-reuse-ci
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify packaged upgrade and rollback
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-workspace

      - name: Download immutable release packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/packages/target" "$RUNNER_TEMP/packages/source"
          gh release download wework-v0.6.8-beta.6 \
            --repo wecode-ai/Wegent \
            --dir "$RUNNER_TEMP/packages/target" \
            --pattern 'release-macos-arm64.json' \
            --pattern 'WeWorkRelease_0.6.8-beta.6_macos_arm64.tar.gz'
          gh release download wework-v0.6.7 \
            --repo wecode-ai/Wegent \
            --dir "$RUNNER_TEMP/packages/source" \
            --pattern 'release-macos-arm64.json' \
            --pattern 'WeWorkRelease_0.6.7_macos_arm64.tar.gz'

      - name: Verify the complete package transaction
        env:
          GH_TOKEN: ${{ github.token }}
          WEWORK_E2E_REQUIRE_RELEASE_PACKAGE: "1"
          WEWORK_UPGRADE_DIAGNOSTIC_CHECKPOINT: upgrade-and-rollback
          WEWORK_UPGRADE_SOURCE_ASSETS: ${{ runner.temp }}/packages/source
          WEWORK_UPGRADE_SOURCE_VERSION: 0.6.7
          WEWORK_UPGRADE_DIAGNOSTICS_DIR: ${{ runner.temp }}/diagnostics
        run: |
          set -euo pipefail
          status=0
          node wework/scripts/verify-release-upgrades.mjs \
            "${{ runner.temp }}/packages/target" \
            macos arm64 beta wecode-ai/Wegent wework-v0.6.8-beta.6 || status=$?
          if [[ "$status" -ne 0 ]]; then
            while IFS= read -r file; do
              echo "===== $file ====="
              tail -n 200 "$file"
            done < <(
              find "$WEWORK_UPGRADE_DIAGNOSTICS_DIR" -type f \
                \( -name 'failure*.json' -o -name 'failure*.txt' -o -name '*.log' -o \
                   -name '*result.json' -o -name 'ui-snapshot.json' \) \
                -size -5M -print | sort
            )
          fi
          exit "$status"

      - name: Retain package verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wework-4567-package-verification
          path: |
            ${{ runner.temp }}/diagnostics/**/*.log
            ${{ runner.temp }}/diagnostics/**/*result.json
            ${{ runner.temp }}/diagnostics/**/failure*.json
            ${{ runner.temp }}/diagnostics/**/failure*.txt
            ${{ runner.temp }}/diagnostics/**/ui-snapshot.json
          if-no-files-found: ignore
          retention-days: 3
